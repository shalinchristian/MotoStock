services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: motostock
      MYSQL_USER: motostock
      MYSQL_PASSWORD: ${DB_PASSWORD:-motostock}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/motostock?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: motostock
      DB_PASSWORD: ${DB_PASSWORD:-motostock}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-to-32-plus-bytes}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-staff123}
      SEED_DATA: ${SEED_DATA:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "4000:4000"

volumes:
  mysql-data:
