spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/motostock?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:motostock}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
