spring.application.name=motostock
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-me-dev-only-secret-change-me-dev-only-secret-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# Comma separated origins allowed by CORS (the web container proxies /api, so this is mainly for local dev)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4000,http://localhost:3000}
# Seed demo data (bikes, sales, test rides, users) when the DB is empty
app.seed.enabled=${SEED_DATA:true}
# Initial accounts created by the seeder
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.staff-password=${STAFF_PASSWORD:staff123}

springdoc.swagger-ui.path=/swagger-ui.html
